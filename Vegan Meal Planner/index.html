<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Vegan Meal Planner</title>

<link rel="stylesheet" href="styles.css">

<link rel="manifest" href="manifest.json">

</head>

<body>

<h1>🌱 Vegan Meal Planner</h1>

<label>Number of Servings</label>
<br>
<input type="number" id="servings" value="4" min="1">

<div class="menu">

<button onclick="show('plan')">Monthly Plan</button>
<button onclick="show('recipes')">Recipes</button>
<button onclick="show('grocery')">Grocery List</button>
<button onclick="show('prep')">Meal Prep</button>

</div>

<div id="plan" class="section"></div>
<div id="recipes" class="section"></div>
<div id="grocery" class="section"></div>

<div id="prep" class="section">

<h2>Weekly Meal Prep</h2>

<ul>

<li>Cook large batch of rice</li>
<li>Cook lentils or beans</li>
<li>Chop onions, carrots, peppers</li>
<li>Roast potatoes and broccoli</li>
<li>Make hummus</li>

</ul>

</div>

<script src="recipes.js"></script>
<script src="mealplan.js"></script>
<script src="app.js"></script>

</body>
</html>
